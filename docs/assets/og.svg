<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaf7fa"/>
      <stop offset="55%" stop-color="#cfe8f7"/>
      <stop offset="100%" stop-color="#bdeaf2"/>
    </linearGradient>
    <radialGradient id="planet" cx="37%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#d2ebcc"/>
      <stop offset="100%" stop-color="#a3cead"/>
    </radialGradient>
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffeec2"/>
      <stop offset="100%" stop-color="#f7c76b"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>

  <!-- faint stars -->
  <g fill="#7293a0" fill-opacity="0.35">
    <circle cx="120" cy="90" r="2.5"/>
    <circle cx="260" cy="150" r="1.8"/>
    <circle cx="520" cy="80" r="2.2"/>
    <circle cx="700" cy="120" r="1.6"/>
    <circle cx="1040" cy="70" r="2.4"/>
    <circle cx="1140" cy="180" r="1.8"/>
    <circle cx="980" cy="540" r="2"/>
    <circle cx="640" cy="560" r="1.6"/>
    <circle cx="180" cy="520" r="2.2"/>
  </g>

  <!-- orbit system -->
  <g transform="translate(880 315) rotate(-16)">
    <ellipse rx="255" ry="95" fill="none" stroke="#7293a0" stroke-opacity="0.32" stroke-width="3"/>
    <ellipse rx="178" ry="66" fill="none" stroke="#7293a0" stroke-opacity="0.20" stroke-width="2"/>
    <circle r="96" fill="url(#planet)"/>
    <circle r="96" fill="#25323a" fill-opacity="0.05"/>
    <!-- message orbs sitting on the orbits -->
    <circle cx="255" cy="0" r="15" fill="url(#orbGlow)"/>
    <circle cx="255" cy="0" r="27" fill="#f7c76b" fill-opacity="0.20"/>
    <circle cx="-128" cy="-82" r="9" fill="url(#orbGlow)"/>
    <circle cx="89" cy="57" r="7" fill="url(#orbGlow)"/>
  </g>

  <!-- text -->
  <text x="92" y="262" font-family="Arial, Helvetica, sans-serif" font-size="94" font-weight="700" fill="#25323a" letter-spacing="1">Quiet Orbit</text>
  <text x="95" y="326" font-family="Arial, Helvetica, sans-serif" font-size="33" fill="#3c4a52">A small planet to wander.</text>
  <text x="95" y="370" font-family="Arial, Helvetica, sans-serif" font-size="33" fill="#3c4a52">A quiet message to find.</text>
  <text x="95" y="566" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#7293a0">github.com/jeiel85/messenger-planet-web</text>
</svg>
